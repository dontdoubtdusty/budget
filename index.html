<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Big Minty</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fff6ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170f1c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Big Minty"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Theme ===== */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light;--bg:#fff6ee;--card:#fff;--fld:#fff0e5;--tx:#2b1a2e;--mu:#8a7088;--ac:#17a65a;--bd:#f4e1d4;--neg:#e8295b;--wn:#f08c00;--pc:#ff6a2b;--pc2:#ff3d71;--brand:#00c244;--gl:10%;--tst:#2b1a2e;--sh:0 1px 2px rgba(90,30,60,.05),0 10px 24px -14px rgba(90,30,60,.22);--fast:.16s;--fd:'Fredoka','Nunito',system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#170f1c;--card:#231829;--fld:#2e2136;--tx:#fbeef6;--mu:#b59bb6;--ac:#3ddc84;--bd:#3a2a44;--neg:#ff5c85;--wn:#ffb020;--sh:0 10px 24px -16px rgba(0,0,0,.7);--gl:20%;--tst:#3b2a44}
:root[data-theme="dark"] .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),var(--sh)}:root[data-theme="dark"] .bp div,:root[data-theme="dark"] .ssum .stot div{background:color-mix(in srgb,var(--pc) 14%,var(--card))}

/* ===== Base ===== */
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 440px at 50% -140px,color-mix(in srgb,var(--pc) var(--gl),transparent),transparent 72%) no-repeat,var(--bg);color:var(--tx);font:500 15px/1.45 'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}input,select,button,b,.k,.ln{font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding:12px}
/* Clips the page while it slides sideways, so it can never widen the viewport (which made the fixed nav twitch on iOS) */
.vclip{overflow:hidden;width:100%}
.view{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start;touch-action:pan-y}
.view>.seg,.view>h2,.view>button,.view>p,.view>.tiles,.view>.wide,.view>.warn,.view>.pcb{grid-column:1/-1}
h2,h3{margin:0 0 10px;font-family:var(--fd);font-weight:600}h2{font-size:20px;letter-spacing:-.2px}h3{font-size:16px;display:flex;justify-content:space-between;gap:8px}.wide h3{align-items:center}
.view>h2{margin:8px 2px 0}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.mu{color:var(--mu);font-size:13px}.neg{color:var(--neg)}.pos{color:var(--ac)}.b{font-weight:600}
.sec{display:block;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mu);margin:2px 0 6px}

/* ===== Cards & rows ===== */
.card,.tile{border-radius:22px;box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--bd);padding:16px}
.view>.card{background-image:linear-gradient(90deg,var(--pc),var(--pc2));background-size:100% 5px;background-repeat:no-repeat;background-origin:border-box;padding-top:19px}.card h2{color:var(--pc)}
.row{display:flex;gap:8px;align-items:center;margin:2px 0;min-height:38px}.row>*{min-width:0}.row>.mu{flex:none}
.k{display:flex;justify-content:space-between;padding:3px 0}
.ln{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}.ln span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ln b{font-weight:600;white-space:nowrap}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.g2>*{min-width:0}
@media(max-width:520px){.g2{grid-template-columns:minmax(0,1fr);gap:16px}.g2>*+*{border-top:1px solid var(--bd);padding-top:14px}}
.ro{flex:1;padding:7px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ro.a{flex:none;width:90px;text-align:right}
.tag{flex:none;font-size:10px;font-weight:800;letter-spacing:.4px;color:#8b3ff0;background:color-mix(in srgb,#8b3ff0 14%,transparent);border-radius:99px;padding:3px 8px}
.tag.debt{color:#e8295b;background:color-mix(in srgb,#e8295b 14%,transparent)}.tag.sub{color:#00a597;background:color-mix(in srgb,#00b3a4 16%,transparent)}
.bar{height:8px;background:var(--fld);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pc),var(--pc2));transition:width .35s cubic-bezier(.2,.8,.2,1)}
.bang{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-right:6px;border-radius:50%;background:var(--wn);color:#fff;font-weight:800;font-size:12px;line-height:1}

/* ===== Inputs & buttons ===== */
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],textarea,select{width:100%;padding:9px 10px;border:1px solid transparent;border-radius:12px;background:var(--fld);color:var(--tx);font:inherit;transition:border-color var(--fast),background var(--fast)}
.row input[type=text],.row input[type=number],.row input[type=date],.row select{padding:7px 8px}
input.a,input[type=number]{width:90px;flex:none;text-align:right}input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:color-mix(in srgb,var(--pc) 60%,transparent);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 18%,transparent)}
textarea{height:140px;font:12px ui-monospace,monospace}
.dt{position:relative;display:inline-flex;align-items:center;justify-content:center;width:62px;flex:none;padding:7px 4px;border:1px solid transparent;border-radius:10px;background:var(--fld);color:var(--tx);cursor:pointer;white-space:nowrap;font:inherit;font-size:14px}.dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;margin:0;cursor:pointer}
/* Read mode: list rows look like plain text until you tap a field */
.ed input[type=text],.ed input[type=number],.ed .dt{background:transparent}
@media(hover:hover){.ed input[type=text]:hover,.ed input[type=number]:hover,.ed .dt:hover{background:var(--fld)}}
.ed input[type=text]:focus,.ed input[type=number]:focus{background:var(--card)}
.ed input.a,.ed .ro.a{width:74px}.ed .ro{padding:7px 6px}.ed input[type=text],.ed input[type=number]{padding-left:6px;padding-right:6px}.ed button.x{padding:8px 4px}.ed{gap:6px}
/* Checkboxes with a little pop when ticked */
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:24px;height:24px;flex:none;margin:0;border:2px solid color-mix(in srgb,var(--mu) 45%,transparent);border-radius:8px;background:var(--card);display:inline-grid;place-content:center;cursor:pointer;transition:background var(--fast),border-color var(--fast)}
input[type=checkbox]::after{content:"";width:6px;height:11px;margin-top:-3px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--pc),var(--pc2));border-color:transparent}input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
input[type=checkbox].pop{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{40%{transform:scale(1.22)}}
.ed:has(>input[type=checkbox]:checked)>:is(.ro,input[type=text],input[type=number]){opacity:.5;text-decoration:line-through}.ed:has(>input[type=checkbox]:checked)>.tag{opacity:.5}
button{background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--pc) 70%,transparent);transition:transform .25s var(--bounce),filter .1s,background var(--fast)}
button.g,button.x,nav button,.seg button,.gear,.dots button,.pctop>button,#toast button,.warn .row button{box-shadow:none}
button:active{transform:scale(.93);filter:brightness(.95);transition-duration:.08s}
button.g{background:none;color:var(--mu);padding:8px 10px;font-weight:600}button.x{background:none;color:var(--neg);padding:8px 8px;font-weight:600}
button.bd{border:1px solid var(--bd);color:var(--tx)}
.seg{display:flex;gap:6px}.seg button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.seg.qm button{border-radius:999px;padding:9px 6px}.seg.qm button.on{background:linear-gradient(135deg,var(--pc),var(--pc2));border-color:transparent;color:#fff;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--pc) 70%,transparent)}
.warn{border-color:var(--wn);background:color-mix(in srgb,var(--wn) 10%,var(--card))}.warn h3{color:var(--wn)}.warn .row button{padding:5px 10px;font-size:13px}
.view>.delchk{grid-column:1/-1;justify-self:center;margin:-4px 0 0;font-size:13px}

/* ===== Header & bottom nav ===== */
.top{display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);color:var(--tx);border-bottom:1px solid var(--bd);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;margin-top:calc(-1 * env(safe-area-inset-top,0px));font:600 20px/1.2 var(--fd);letter-spacing:-.2px;text-align:center}
.top .tt{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 44px;white-space:nowrap}.top .logo{flex:none;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.jz{background:linear-gradient(90deg,#2fd36b,#00b844 55%,#0ea5a0);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.gear{position:absolute;right:10px;bottom:7px;background:none;color:var(--mu);width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px}.gear.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 13%,transparent)}
nav{position:fixed;z-index:6;left:0;right:0;bottom:0;display:flex;align-items:center;gap:2px;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--bd);padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-width:0;background:none;color:var(--mu);border-radius:16px;padding:6px 0 5px;font-size:11px;font-weight:500;letter-spacing:-.1px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button{font-weight:700;transition:color .25s}nav button.on{color:var(--tc)}
nav button:not(.qab):active{transform:none;filter:none}
.nh{flex:1;display:flex;gap:2px;min-width:0;position:relative;z-index:1}.nh button{flex:1;min-width:0}.ni{width:23px;height:23px}
/* One highlight pill that glides between tabs; the buttons themselves never move */
.hl{position:absolute;left:0;top:0;z-index:0;pointer-events:none;border-radius:16px;width:var(--hw,0);height:var(--hh,0);transform:translate3d(var(--hx,0),var(--hy,0),0);background:color-mix(in srgb,var(--hc,#ff6a2b) 14%,transparent);opacity:var(--ho,0);transition:transform .34s var(--bounce),width .34s var(--bounce),opacity .2s,background .25s}
nav.drag .hl{transition:none}
/* Neighbouring tab shown beside the current one while swiping */
#peek{position:fixed;left:0;right:0;bottom:0;z-index:4;overflow:hidden;pointer-events:none;background:var(--bg);will-change:transform}
#peek>.view{max-width:1100px;margin:0 auto;padding:12px}
nav button.qab,nav button.qab.on{flex:none;width:64px;height:64px;margin:-26px 6px 0;border-radius:50%;background:linear-gradient(135deg,#ff3d71,#ff8a3d);color:#fff;padding:0;justify-content:center;gap:0;box-shadow:0 8px 20px -4px #ff3d7180;border:4px solid var(--bg)}
nav button.qab b{font:600 30px/.9 var(--fd)}nav button.qab span{font-size:9px;font-weight:800}

/* ===== Toast ===== */
#toast{position:fixed;z-index:30;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);background:var(--tst);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{background:none;color:#ffb020;padding:6px 10px;font-weight:800}

/* ===== Paycheck switcher ===== */
.pcb{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;border-radius:26px;padding:14px 12px;box-shadow:0 12px 24px -12px color-mix(in srgb,var(--pc) 70%,transparent);transition:background .3s}
.pcb:before,.pcb:after{content:"";position:absolute;border-radius:50%;background:#ffffff1c;pointer-events:none}.pcb:before{left:-50px;bottom:-80px;width:180px;height:180px}.pcb:after{right:-40px;top:-60px;width:140px;height:140px;background:#ffffff14}.pcb>*{position:relative;z-index:1}
.pctop{display:flex;align-items:center;gap:8px}
.pctop>button{background:#ffffff2e;color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;padding:0;flex:none}.pctop>button:disabled{opacity:.35}
.pct{flex:1;text-align:center;line-height:1.25}.pct b{display:block;font:600 23px/1.2 var(--fd);letter-spacing:-.2px}.pct span{font-size:13px;opacity:.9}
.dots{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.dots button{width:32px;height:32px;border-radius:50%;padding:0;font-size:12px;font-weight:700;color:#fff;border:2px solid #ffffff99;opacity:.75}
.dots button.on{opacity:1;border-color:#fff;box-shadow:0 0 0 3px #ffffff55;transform:scale(1.1)}

/* ===== Home tiles & donut ===== */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;overflow:hidden;padding:14px 16px;min-width:0;color:#fff;transition:background .3s}.tile .mu{font-size:12px;color:#ffffffd9;font-weight:500}.tile b{display:block;font:600 27px/1.15 var(--fd);white-space:nowrap;margin-top:2px}
.tile.good{background:linear-gradient(135deg,#2fd27a,#0e9f6e)}.tile.bad{background:linear-gradient(135deg,#ff5c85,#e8295b)}.tile.zero{background:linear-gradient(135deg,#a58fb5,#6f5b80)}.tile.due{background:linear-gradient(135deg,#ffb020,#ff6a2b)}
.bp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}.bp div{background:color-mix(in srgb,var(--pc) 8%,var(--card));border:0;border-radius:16px;padding:10px 14px}.bp b{display:block;font:600 21px/1.2 var(--fd)}
.pie{display:flex;gap:18px;align-items:center;max-width:620px;margin:0 auto}.pie svg{width:156px;flex:none}
.pie circle{transition:stroke-dasharray .4s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .4s cubic-bezier(.2,.8,.2,1)}
.lg{flex:1;font-size:13px;min-width:0}.lg div{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.lg div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.lg div span:last-child{white-space:nowrap;color:var(--mu)}
@media(max-width:420px){.pie{gap:12px}.pie svg{width:118px}.lg{font-size:12px}}

/* ===== Credit card visual ===== */
.ccw{padding:12px}.cc{position:relative;color:#fff;border-radius:18px;padding:18px 20px;aspect-ratio:1.586;max-width:400px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 20px rgba(16,24,40,.2);overflow:hidden}
.cc:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:#ffffff14}.cc>*{position:relative;z-index:1}
.cct{display:flex;justify-content:space-between;align-items:center}.ccn{font-size:17px;font-weight:700;letter-spacing:.3px}
.chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#fde68a,#d4a72c);box-shadow:inset 0 0 0 1px #00000026}
.ccm span{display:block;font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.8px}.ccm b{font:600 30px/1.2 var(--fd)}.ccm b.ccneg{color:#fecaca}
.ccbar{height:6px;border-radius:3px;background:#ffffff33;overflow:hidden}.ccbar i{display:block;height:100%;transition:width .35s}
.ccb{display:flex;justify-content:space-between}.ccb span{display:block;font-size:10px;opacity:.8;text-transform:uppercase;letter-spacing:.8px}.ccb b{font-size:15px}.ccb div:last-child{text-align:right}


/* ===== Subscriptions ===== */
.ssum .stot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.ssum .stot div{background:color-mix(in srgb,var(--pc) 8%,var(--card));border-radius:16px;padding:10px 14px}.ssum .stot b{display:block;font:600 24px/1.2 var(--fd)}
.sbar{display:flex;gap:3px;height:12px;border-radius:99px;overflow:hidden}.sbar i{display:block;min-width:3px}
.sgrp{padding-top:12px;padding-bottom:4px}.subrow+.subrow{border-top:1px solid var(--bd)}
.subrow summary{display:flex;align-items:center;gap:12px;padding:10px 0}
.sbadge{flex:none;width:42px;height:42px;border-radius:15px;display:grid;place-content:center;color:#fff;font:600 19px var(--fd)}
.snm{flex:1;min-width:0;display:flex;flex-direction:column}.snm b,.snm .mu{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.snm b{font-weight:600}
.sright{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}.sright b{font-weight:700}
.dchip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--fld);color:var(--mu);white-space:nowrap}
.dchip.soon{background:color-mix(in srgb,#f97316 15%,transparent);color:#ea580c}.dchip.late{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
:root[data-theme="dark"] .dchip.soon{color:#fb923c}
.spaid{flex:none;padding:6px 12px;font-size:13px}
.subrow[open] summary{padding-bottom:6px}.sedit{padding:0 0 12px 52px}
@media(max-width:380px){.sedit{padding-left:0}}

/* ===== Accounts ===== */
.asum .big{display:block;font:600 38px/1.1 var(--fd);margin:2px 0 4px}
.aedit{padding:2px 0 12px}
.dchip.up{background:color-mix(in srgb,#16a34a 14%,transparent);color:#16a34a}.dchip.down{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
:root[data-theme="dark"] .dchip.up{color:#4ade80}

/* ===== Card color swatches ===== */
.sw{display:flex;flex-wrap:wrap;gap:10px;padding:4px 0}.sw button{width:34px;height:34px;padding:0;border-radius:50%;box-shadow:none;transition:transform .25s var(--bounce),box-shadow .15s}
.sw button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--tx);transform:scale(1.08)}

/* ===== Greeting, confetti, icons ===== */
.view>.hello{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 4px -2px}
.hello b{font:600 25px/1.2 var(--fd)}.hello span{flex:none;font-size:13px;font-weight:800;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent);padding:5px 12px;border-radius:99px}
.ic{display:inline-block;vertical-align:-2px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}.confetti i{position:absolute;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}

/* ===== Drag to reorder ===== */
.dh{flex:none;display:flex;align-items:center;justify-content:center;width:22px;height:34px;margin-left:-6px;color:var(--mu);opacity:.45;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}.dh:active{cursor:grabbing}
.dragging{position:relative;z-index:20;background:var(--card);border-radius:10px;box-shadow:0 10px 24px rgba(16,24,40,.18),0 0 0 1px var(--bd);transition:box-shadow .15s}.dragging .dh{opacity:1;color:var(--pc)}
body.dragmode{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* ===== Popup (choice dialog) ===== */
#dlg{position:fixed;inset:0;z-index:35;display:grid;place-items:end center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(16,8,22,.45);animation:dfade .18s ease-out}
#dlg[hidden]{display:none}
.dbox{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:dup .28s cubic-bezier(.16,1,.3,1)}
.dbox h3{margin:0 0 6px;font:600 20px/1.2 var(--fd);color:var(--tx)}.dbox p{margin:0 0 16px;font-size:14px}
.dbtns{display:flex;flex-direction:column;gap:8px}.dbtns button{width:100%;padding:12px 16px}
@media(min-width:600px){#dlg{place-items:center}}
@keyframes dfade{from{opacity:0}}@keyframes dup{from{transform:translateY(28px);opacity:0}}

/* ===== Logged paychecks ===== */
.lgrow{display:flex;align-items:center;gap:12px;width:100%;background:none;color:var(--tx);box-shadow:none;border-radius:0;padding:12px 2px;text-align:left;font-weight:600}
.lgrow+.lgrow{border-top:1px solid var(--bd)}.lgrow:active{transform:none;filter:none;background:var(--fld)}
.lgrow>span{flex:1;min-width:0;display:flex;flex-direction:column}.lgrow .mu{font-weight:500}.lgrow>b{white-space:nowrap}.lgrow>i{font-style:normal;color:var(--mu);font-size:20px}
.rob{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);background:var(--fld);border-radius:99px;padding:3px 10px;margin-bottom:8px}
.lrow{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:14px}.lrow>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow>b{font-weight:600;white-space:nowrap}.lrow .lst{width:52px;text-align:right;flex:none}.lrow.pd>span:first-child,.lrow.pd>b{opacity:.5;text-decoration:line-through}
.view>.lback{justify-self:start}

@media(prefers-reduced-motion:reduce){*,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style></head><body><header class="top"><span class="tt"><svg class="logo" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#00a83a"/><circle cx="16" cy="16" r="12.2" fill="#dcf8e5"/><circle cx="16" cy="16" r="10.6" fill="#2fd36b"/><path d="M16 6v20M6 16h20M8.6 8.6l14.8 14.8M23.4 8.6 8.6 23.4" stroke="#dcf8e5" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="16" r="2.2" fill="#dcf8e5"/></svg><span><span class="jz">Big Minty</span> Finances</span></span><button id="gear" class="gear" aria-label="Settings" data-a="gear"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.820l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.830-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></header><div class="vclip"><main id="app" class="view"></main></div><nav id="nav"></nav><div id="toast" role="status" aria-live="polite"></div><div id="dlg" hidden></div>
<script src="sync.js"></script>
<script>
// =====================================================================
// 1. CONSTANTS
// =====================================================================
const LS='budget-v1';                      // localStorage key (don't change: it holds your data)
const G=['Needs','Wants','Savings'],TG={Needs:.5,Wants:.3,Savings:.2};
const PCOL=[['#ff6a2b','#ff3d71'],['#8b3ff0','#e0409f'],['#3d5afe','#8b3ff0'],['#17a65a','#0ea5a0'],['#ff3d71','#ff8a3d'],['#00a99b','#3d5afe']],pcol=i=>PCOL[i%PCOL.length][0],pgrad=i=>`linear-gradient(135deg,${PCOL[i%PCOL.length][0]},${PCOL[i%PCOL.length][1]})`; // paycheck colors
const TC={home:['#ff6a2b','#ff3d71'],budget:['#17a65a','#0ea5a0'],cats:['#8b3ff0','#e0409f'],quick:['#ff3d71','#ff8a3d'],acc:['#3d5afe','#8b3ff0'],debt:['#e8295b','#ff8a3d'],subs:['#00a99b','#3d5afe'],more:['#8b3ff0','#ff3d71']}; // tab colors
const PAL=['#ff6a2b','#ff3d71','#8b3ff0','#3d5afe','#17a65a','#00a99b','#ffb020','#c2185b'];          // pie slices
const CCG=[['#ff3d71','#ff8a3d'],['#8b3ff0','#ff5fa2'],['#3d5afe','#00c2d1'],['#0e9f6e','#9ad83a'],['#e8295b','#ffb020'],['#2b1a2e','#6b4b73'],['#ff6a2b','#ffb020'],['#00a99b','#17a65a']]; // card faces
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FREQ=['Monthly','Bi-Weekly','Weekly'];

// =====================================================================
// 2. GENERAL UTILITIES
// =====================================================================
const num=v=>+v||0;
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const $$=n=>(n<0?'-':'')+Math.abs(n).toLocaleString(undefined,{style:'currency',currency:'USD'});
const cl=n=>n<0?'neg':'';
const uid=p=>p+Math.random().toString(36).slice(2,9);
const DAY_MS=864e5;

// =====================================================================
// 3. DATES  (all dates are local 'YYYY-MM-DD' strings)
// =====================================================================
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); // Date -> local YYYY-MM-DD
const tdy=()=>iso(new Date());
const sd=v=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(v||'');return m?MO[+m[2]-1]+' '+m[3]:'—'};          // "Oct 09"
const longDate=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'2-digit'}):'';  // "Oct 09"
// The date n steps after d. Monthly keeps the same day, clamped to short months (Jan 31 -> Feb 28 -> Mar 31).
function stepDate(d,f,n){const x=new Date(d+'T00:00');if(f=='Monthly'){const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}else x.setDate(x.getDate()+n*(f=='Weekly'?7:14));return iso(x)}

// =====================================================================
// 4. STATE: seed data, schema migrations, load/save
// =====================================================================
let S,T='home',K=0;                       // data, current tab, current paycheck index
let O={},QC=0,QK=0,QM='cat',XO=0,FL='';   // UI-only: open <details>, quick-add selections, extra-income form open, flash message
let LV=null,DLG=null;                     // UI-only: logged paycheck open in Settings (its id), open popup

// Generic defaults: used for brand-new installs (and to fill gaps in very old saved data)
const DED=()=>[];
const CATS=(i,d)=>[['Groceries',0,'Needs'],['Fun money',0,'Wants']].map(([n,b,g])=>({id:uid('c'),n,b,g,tx:[]}));
// A brand-new install starts empty: one paycheck dated today, a couple of starter categories, one account
function seed(){const d=tdy();
 return {set:{pct:81.5,welcome:1,since:Date.now()},
 checks:[{ded:[],date:d,rate:0,hours:80,net:0,extra:0,extraTx:[],prev:0,adj:0,items:[],cats:CATS(0,d)}],
 acc:[{n:'Checking',tx:[]}],cards:[],loans:[],subs:[],logs:[]}}

// Schema migrations. S.v records how many have run. To change the data shape later,
// ADD a new function to the end of this list — never edit an old one.
const MIGRATIONS=[
 // v1: everything earlier versions patched on every load (safe to re-run on old data)
 S=>{S.set=S.set||{};
  if(S.set.pct==null)S.set.pct=S.set.lo&&S.set.hi?(S.set.lo+S.set.hi)/2:81.5;
  S.subs.forEach(s=>{if(!s.id)s.id=uid('s')});
  S.loans.forEach(l=>{if(!l.id)l.id=uid('l');l.pays.forEach(p=>{if(p.a==null)p.a=num(l.amt)})});
  S.cards.forEach(c=>{if(!c.tx)c.tx=[]});
  if(!S.set.subsLinked){S.set.subsLinked=1;const nm=new Set(S.subs.filter(s=>s.last&&num(s.a)).map(s=>(s.n||'').trim().toLowerCase()));S.checks.forEach(c=>{c.items=c.items.filter(i=>i.cat||i.sub||i.g!='Wants'||!nm.has((i.n||'').trim().toLowerCase()))})}
  S.checks.forEach((c,i)=>{
   if(!c.extraTx)c.extraTx=num(c.extra)?[{d:c.date,t:'Extra income',a:num(c.extra)}]:[];c.extra=0;
   c.ded=c.ded||DED();c.cats=c.cats||CATS(i,c.date);
   c.cats.forEach((k,j)=>{if(!k.id)k.id='c'+j+Math.random().toString(36).slice(2,6);if(k.g===undefined){const x=c.items.find(y=>!y.cat&&y.n==k.n);k.g=x?x.g:'';if(x)x.cat=k.id}})})},
 // v2: theme setting replaces the dark-mode checkbox ('system' follows the phone)
 S=>{if(S.set.theme==null)S.set.theme=S.set.dark?'dark':'system';delete S.set.dark},
 // v3: weekly backup reminder counts from when the app was first used (or from this update)
 S=>{if(!S.set.since)S.set.since=Date.now()},
 // v4: every loan payment gets its own id and its own budget item (old items merged all payments in a paycheck)
 S=>{S.loans.forEach(l=>l.pays.forEach(p=>{if(!p.id)p.id=uid('p')}));S.checks.forEach(c=>{c.items=c.items.filter(i=>!i.loan||i.pay)})},
 // v5: logged paychecks (read-only copies of deleted paychecks)
 S=>{if(!Array.isArray(S.logs))S.logs=[]},
];
function migrate(){S.set=S.set||{};for(let v=S.v||0;v<MIGRATIONS.length;v++)MIGRATIONS[v](S);S.v=MIGRATIONS.length;pruneLogs();sync()}
function load(){try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}if(!S)S=seed();migrate()}
// Saving: recalculate now, write to storage a moment later (and immediately when the app is hidden or closed)
let SVT=0,SVFAIL=0;
// Saving can fail (storage full, private browsing, blocked site data). Say so once instead of failing silently.
function flush(){clearTimeout(SVT);SVT=0;try{const t=JSON.stringify(S);localStorage.setItem(LS,t);SVFAIL=0;window.CloudSync&&CloudSync.saved(t)}catch(e){if(!SVFAIL){SVFAIL=1;setTimeout(()=>toast('Couldn’t save on this device. Download a backup in Settings.'),0)}}}
const save=()=>{sync();clearTimeout(SVT);SVT=setTimeout(flush,400)};
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

// Path-based edits: 'checks.0.items.3.a' etc.
const get=p=>p.split('.').reduce((o,k)=>o[k],S);
function up(p,v,t){const k=p.split('.'),l=k.pop(),o=k.reduce((o,x)=>o[x],S);o[l]=t=='n'?(parseFloat(v)||0):v;save();R()}
function add(p,o){get(p).push(o);save();R()}
function del(p,i){const [x]=get(p).splice(i,1),nm=x&&(x.n||x.t);save();R();toast('Deleted'+(nm?' “'+nm+'”':''),()=>{get(p).splice(i,0,x);save();R()},'del')}
// Undo toast
let TT=0,UNDO=null,UGRP='',UCNT=0;
// grp: consecutive toasts in the same group (e.g. several quick deletes) share one Undo that reverts all of them, newest first
function toast(msg,undo,grp){const el=document.getElementById('toast');
 if(undo&&grp&&UNDO&&UGRP==grp){const prev=UNDO,cur=undo;undo=()=>{cur();prev()};UCNT++;msg=grp=='del'?`Deleted ${UCNT} items`:msg}else UCNT=1;
 UGRP=undo?grp||'':'';el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-a="undo">Undo</button>':''}`;UNDO=undo||null;el.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>{el.classList.remove('on');UNDO=null;UGRP=''},5000)}
// Backup reminder: nag once a week since the last backup (or snooze), counting from first use
const needBk=()=>Date.now()-Math.max(num(S.set.lastBk),num(S.set.bkSnooze),num(S.set.since))>7*DAY_MS;
const markBk=()=>{S.set.lastBk=Date.now();save();R()};
const bkNag=()=>needBk()?`<div class="card wide"><h3><span>Back up your budget?</span></h3><p class="mu" style="margin:0 0 12px">It’s only saved in this browser, and some browsers clear site data after a while.</p><div class="row"><button data-a="tab" data-id="more">Back up</button><button class="g bd" data-a="bkLater">Later</button></div></div>`:'';

// =====================================================================
// 5. CALCULATIONS (pure reads of S)
// =====================================================================
const chkEnd=i=>{const n=S.checks[i+1];return n?n.date:stepDate(S.checks[i].date,'Bi-Weekly',1)}; // first day after paycheck i's window
// Logged paychecks: frozen copies of deleted paychecks, removed six months after their pay date.
// Nothing recalculates or syncs them (sync() only walks S.checks), so they stay exactly as they were.
const LOG_MO=6;
const logCut=()=>stepDate(tdy(),'Monthly',-LOG_MO);   // pay dates before this have expired
const logExp=g=>stepDate(g.c.date,'Monthly',LOG_MO);   // the day a logged paycheck is removed
const logEndDay=g=>{const e=new Date(g.end+'T00:00');e.setDate(e.getDate()-1);return iso(e)};
function pruneLogs(){if(!Array.isArray(S.logs))return false;const n=S.logs.length,cut=logCut();S.logs=S.logs.filter(g=>g&&g.c&&g.c.date>=cut);return S.logs.length!=n}
// Snapshot paycheck i (call before removing it). tp: what was still unpaid, loan payments included, as [name, amount]
function logOf(i){const c=JSON.parse(JSON.stringify(S.checks[i])),E=chkEnd(i),tp=[];
 c.items.forEach(x=>{if(!x.cat&&!x.loan&&!x.paid&&num(x.a))tp.push([x.n||'Untitled',num(x.a)])});
 S.loans.forEach(l=>l.pays.forEach(p=>{if(!p.paid&&p.d>=c.date&&p.d<E)tp.push([l.n+' ('+fd(p.d)+')',payAmt(l,p)])}));
 return {id:uid('g'),at:Date.now(),n:i+1,end:E,c,tp}}
const spent=k=>sum(k.tx,t=>num(t.a));
const accTot=a=>sum(a.tx,t=>num(t.a));
const cOwed=c=>num(c.bal)+sum(c.tx||[],t=>num(t.a)),cAvail=c=>num(c.limit)-cOwed(c);
const payAmt=(l,p)=>p.a==null?num(l.amt):num(p.a);
const loanBal=l=>l.orig-sum(l.pays.filter(p=>p.paid),p=>payAmt(l,p));
const moEq=s=>s.f=='Bi-Weekly'?s.a*26/12:s.f=='Weekly'?s.a*52/12:s.a;
const subAmt=s=>s.f=='Bi-Weekly'?num(s.a)/2:num(s.a);
const subOn=s=>s.last&&num(s.a)&&!S.loans.some(l=>l.n==s.n);
// Every due date of subscription s within [a, b)
function subDates(s,a,b){if(!s.last)return[];let n=0,g=0;while(stepDate(s.last,s.f,n)>=a&&g++<500)n--;g=0;while(stepDate(s.last,s.f,n)<a&&g++<500)n++;const r=[];g=0;let d;while((d=stepDate(s.last,s.f,n))<b&&g++<60){r.push(d);n++}return r}
const dsum=(c,pre)=>sum(c.ded.filter(d=>!!d.pre==pre),d=>num(d.a));
const est=(c,pc)=>(c.rate*c.hours-dsum(c,true))*pc/100-dsum(c,false);
function calc(c){const by={};G.forEach(x=>by[x]=sum(c.items.filter(i=>i.g==x),i=>num(i.a)));const exp=sum(G,x=>by[x]),ex=sum(c.extraTx||[],t=>num(t.a)),inc=c.net+ex;
 return{by,exp,inc,ex,budget:inc+c.prev+c.adj,roll:inc+c.prev+c.adj-exp,paid:sum(c.items.filter(i=>i.paid),i=>num(i.a))}}

// =====================================================================
// 6. SYNC: keep linked budget items (categories, subs, loans) up to date
// =====================================================================
function sync(){S.checks.forEach(c=>{c.cats.forEach(k=>{if(!k.g)return;let x=c.items.find(i=>i.cat==k.id);if(!x){x={cat:k.id,paid:false};c.items.push(x)}x.g=k.g;x.n=k.n;x.a=+k.b||0});c.items=c.items.filter(i=>!i.cat||c.cats.some(k=>k.id==i.cat&&k.g))});syncSubs();syncLoans()}
// Subscriptions due inside a paycheck's window become linked Wants items
function syncSubs(){S.checks.forEach((c,ci)=>{const a=c.date,b=chkEnd(ci),keep=new Set();
 S.subs.forEach(s=>{if(!subOn(s))return;const ds=subDates(s,a,b);if(!ds.length)return;keep.add(s.id);let x=c.items.find(i=>i.sub==s.id);if(!x){x={sub:s.id};c.items.push(x)}x.g='Wants';x.n=s.n;x.a=+(subAmt(s)*ds.length).toFixed(2);x.due=ds[ds.length-1];x.paid=s.last>=x.due});
 c.items=c.items.filter(i=>!i.sub||keep.has(i.sub))})}
// Loan payments due inside a paycheck's window become linked Needs items
// (one item per payment, so two payments on the same day stay separate; paid status mirrors the payment)
function syncLoans(){S.loans.forEach(l=>l.pays.forEach(p=>{if(!p.id)p.id=uid('p')}));
 S.checks.forEach((c,ci)=>{const a=c.date,b=chkEnd(ci),keep=new Set();
 S.loans.forEach(l=>l.pays.filter(p=>p.d>=a&&p.d<b).sort((p,q)=>p.d<q.d?-1:p.d>q.d?1:0).forEach(p=>{keep.add(p.id);let x=c.items.find(i=>i.loan==l.id&&i.pay==p.id);if(!x){x={loan:l.id,pay:p.id};c.items.push(x)}x.g='Needs';x.n=l.n;x.a=+payAmt(l,p).toFixed(2);x.due=p.d;x.paid=!!p.paid}));
 c.items=c.items.filter(i=>!i.loan||(i.pay&&keep.has(i.pay)))})}

// =====================================================================
// 7. SHARED UI PIECES
// =====================================================================
// Inputs bound to a data path save themselves on change (data-p / data-t: n=number, s=string, b=checkbox).
const DT=(v,attrs)=>`<label class="dt"><span>${sd(v)}</span><input type="date" value="${esc(v||'')}" ${attrs}></label>`;
const I=(p,t='text',c='')=>t=='date'?DT(get(p),`data-p="${p}" data-t="s"`):`<input class="${c}" type="${t}" ${t=='number'?'step="0.01" inputmode="decimal"':''} value="${esc(t=='number'?nv(get(p)):get(p))}" data-p="${p}" data-t="${t=='number'?'n':'s'}">`;
// Number fields show cents when there are any (1195.9 -> 1195.90); whole numbers stay whole (80 -> 80)
function nv(v){const n=+v;return v===''||v==null||isNaN(n)?v:Number.isInteger(n)?String(n):n.toFixed(2)}
const C=p=>`<input type="checkbox" ${get(p)?'checked':''} data-p="${p}" data-t="b">`;
const ICX='<svg class="ic" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',ICK='<svg class="ic" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',ARR=up=>`<svg class="ic" viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="${up?'M6 2l4.5 7h-9z':'M6 10L1.5 3h9z'}" fill="currentColor"/></svg>`;
const X=(p,i,label=ICX)=>`<button class="x" data-a="del" data-p="${p}" data-i="${i}"${label==ICX?' aria-label="Delete"':''}>${label}</button>`;
const DH=`<span class="dh" title="Drag to reorder"><svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true"><g fill="currentColor"><circle cx="2.5" cy="3" r="1.5"/><circle cx="7.5" cy="3" r="1.5"/><circle cx="2.5" cy="8" r="1.5"/><circle cx="7.5" cy="8" r="1.5"/><circle cx="2.5" cy="13" r="1.5"/><circle cx="7.5" cy="13" r="1.5"/></g></svg></span>`;
const opts=(list,sel)=>list.map((k,i)=>`<option value="${i}" ${sel==i?'selected':''}>${esc(k.n)}</option>`).join('');
const lines=a=>a.map(([n,v,x])=>`<div class="ln"><span>${esc(n)}</span><b class="${x||''}">${v}</b></div>`).join('');
const recent=(a,def='—')=>a.slice(-5).reverse().map(t=>`<div class="ln"><span>${fd(t.d)} · ${esc(t.t||def)}</span><b>${$$(num(t.a))}</b></div>`).join('');
const flash=()=>FL?`<div class="mu pos" style="margin-top:6px">${esc(FL)}</div>`:'';
const note=t=>`<div class="mu" style="margin-top:6px">${t}</div>`;
// A money amount that counts up/down to its new value when it changes
const N=(v,cls='',tag='b')=>`<${tag} class="${cls}" data-n="${num(v).toFixed(2)}">${$$(num(v))}</${tag}>`;
const rbar=(b,rem)=>{const f=b>0?rem/b:(rem<0?-1:0),w=f<0?100:Math.min(100,Math.max(0,f*100)),col=f>0.5?'#16a34a':f>0.2?'#eab308':'#dc2626';return `<div class="bar" style="margin-bottom:4px"><i style="width:${w}%;background:${col}"></i></div>`};
// An editable transaction row (date · description · amount · delete), optionally draggable
const txRow=(lp,j,drag)=>`<div class="row ed"${drag?` data-dl="${lp}" data-di="${j}"`:''}>${drag?DH:''}${I(`${lp}.${j}.d`,'date')}${I(`${lp}.${j}.t`)}${I(`${lp}.${j}.a`,'number','a')}${X(lp,j)}</div>`;
// A new-transaction form row; fields get ids <pre>d, <pre>t, <pre>a (read back by readTx)
const txForm=(pre,ph,st='')=>`<div class="row" ${st}>${DT(tdy(),`id="${pre}d"`)}<input id="${pre}t" type="text" placeholder="${ph}"><input id="${pre}a" type="number" step="0.01" inputmode="decimal" class="a" placeholder="0.00"></div>`;
function readTx(pre){const g=x=>document.getElementById(pre+x),a=parseFloat(g('a').value);return a?{d:g('d').value||tdy(),t:g('t').value,a}:null}
// Read a txForm and push it onto a list. o: {sign: force +/-, t: default description, fl: x=>flash text, then: ()=>after}
function addTx(pre,list,o={}){const x=readTx(pre);if(!x)return;if(o.sign)x.a=o.sign*Math.abs(x.a);if(!x.t&&o.t)x.t=o.t;list.push(x);o.then&&o.then();FL=o.fl?o.fl(x):'';save();R();FL=''}

// Warning card: subscriptions due during the current paycheck
function subWarn(){const c=S.checks[K],L=[];
 S.subs.forEach((s,i)=>{if(!subOn(s))return;subDates(s,c.date,chkEnd(K)).filter(d=>d>s.last).slice(0,6).forEach((d,n)=>L.push({i,n:s.n,a:subAmt(s),d,first:!n}))});
 if(!L.length)return '';L.sort((a,b)=>a.d<b.d?-1:1);
 return `<div class="card warn"><h3><span><i class="bang">!</i>Subscriptions due this paycheck</span><span>${$$(sum(L,x=>x.a))}</span></h3>${L.map(x=>`<div class="row"><span style="flex:1">${esc(x.n)}</span><span class="mu" style="width:52px">${fd(x.d)}</span><b>${$$(x.a)}</b>${x.first?`<button data-a="paySub" data-i="${x.i}" data-d="${x.d}">Paid</button>`:'<span style="width:52px"></span>'}</div>`).join('')}</div>`}

// ---- Home ----
function pieSvg(c,r){
 const m={};c.items.forEach(i=>{const a=num(i.a);if(a<=0)return;const k=(i.n||'').replace(/\s*\(.*\)$/,'').trim()||'Other';m[k]=(m[k]||0)+a});
 let ent=Object.entries(m).sort((a,b)=>b[1]-a[1]);
 if(ent.length>8)ent=ent.slice(0,7).concat([['Other',sum(ent.slice(7),e=>e[1])]]);
 ent=ent.map((e,i)=>[e[0],e[1],PAL[i]]);
 if(r.roll>0.005)ent.push(['Left over',r.roll,'var(--bd)']);
 const tot=sum(ent,e=>e[1]);if(!tot)return '<p class="mu">Nothing planned for this paycheck yet.</p>';
 // Donut: one stroked circle per slice, with a small gap between slices
 const RR=38,CC=2*Math.PI*RR;let off=0;
 const sl=ent.map(([n,v,col])=>{const len=v/tot*CC,gp=ent.length>1?Math.min(1.4,len*.4):0,s=`<circle cx="50" cy="50" r="${RR}" fill="none" style="stroke:${col}" stroke-width="15" stroke-dasharray="${(len-gp).toFixed(2)} ${(CC-len+gp).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 50 50)"><title>${esc(n)}: ${$$(v)}</title></circle>`;off+=len;return s}).join('');
 const ct=$$(r.exp),fs=ct.length>10?8.5:ct.length>8?10:11.5;
 return `<div class="pie"><svg viewBox="0 0 100 100">${sl}<text x="50" y="${50+fs*.3}" text-anchor="middle" style="fill:var(--tx);font-family:var(--fd);font-size:${fs}px;font-weight:600">${ct}</text><text x="50" y="${50+fs*.3+9}" text-anchor="middle" style="fill:var(--mu);font-size:6.5px">planned</text></svg><div class="lg">${ent.map(([n,v,col])=>`<div><span><i style="background:${col}"></i>${esc(n)}</span><span>${$$(v)} · ${Math.round(v/tot*100)}%</span></div>`).join('')}</div></div>`}
// What's still unpaid in paycheck k (plain items + loan payments due in its window)
function toPayOf(k){const c=S.checks[k],E=chkEnd(k),un=c.items.filter(i=>!i.cat&&!i.loan&&!i.paid&&num(i.a)),due=[];let t=0;
 S.loans.forEach(l=>l.pays.forEach(x=>{if(!x.paid&&x.d>=c.date&&x.d<E){due.push([l.n+' ('+fd(x.d)+')',$$(payAmt(l,x))]);t+=payAmt(l,x)}}));
 return {un,due,tot:sum(un,i=>num(i.a))+t}}
function hello(){const h=new Date().getHours(),g=h<5?'Up late':h<12?'Good morning':h<17?'Good afternoon':'Good evening',t=tdy();
 let nx=(S.checks.find(c=>c.date>t)||{}).date;if(!nx){nx=chkEnd(S.checks.length-1);let g2=0;while(nx<=t&&g2++<100)nx=stepDate(nx,'Bi-Weekly',1)}
 const n=dayDiff(nx);return `<div class="hello"><b>${g}</b><span>${n<=0?'Payday today':n==1?'Payday tomorrow':n+' days to payday'}</span></div>`}
function vHome(){
 const c=S.checks[K],r=calc(c),E=chkEnd(K);
 const tile=(l,v,st)=>`<div class="tile ${st}"><div class="mu">${l}</div>${N(v)}</div>`;
 const bar=(p,bad)=>`<div class="bar" style="margin-bottom:4px"><i style="width:${Math.min(100,p)}%;background:${bad?'var(--neg)':'var(--ac)'}"></i></div>`;
 const {un,due,tot:toPay}=toPayOf(K),lr=Math.round(r.roll*100);
 return hello()+(S.set.welcome?welcome():'')+bkNag()+SEG()+`<button class="x delchk" data-a="delChk">Delete this paycheck</button>`+subWarn()
 +`<div class="tiles">${tile('Left',r.roll,lr>0?'good':lr<0?'bad':'zero')}${tile('Still to pay',toPay,Math.round(toPay*100)>0?'due':'good')}</div>
 <div class="card wide"><h3><span>Where this paycheck goes</span></h3><div class="bp"><div><span class="mu">Budget</span>${N(r.budget)}</div><div><span class="mu">Planned</span>${N(r.exp)}</div></div>${pieSvg(c,r)}</div>
 <div class="card"><div class="sec">50 / 30 / 20</div>${G.map(g=>{const t=r.inc*TG[g],a=r.by[g];return `<div class="ln"><span>${g}</span><b class="${a>t?'neg':''}">${$$(a)} / ${$$(t)}</b></div>${bar(t?a/t*100:0,a>t)}`}).join('')}</div>
 <div class="card"><div class="sec">Left to spend</div>${c.cats.map(k=>{const rem=k.b-spent(k);return `<div class="ln"><span>${esc(k.n)}</span><b class="${cl(rem)}">${$$(rem)}</b></div>${rbar(k.b,rem)}`}).join('')}</div>
 <div class="card g2"><div><div class="sec">Still to pay</div>${lines(un.map(i=>[i.n,$$(i.a)]).concat(due))||`<span class="pos b">All paid ${ICK}</span>`}</div><div><div class="sec">Accounts</div>${lines(S.acc.map(a=>[a.n,$$(accTot(a))]))}<div class="sec" style="margin-top:10px">Credit available</div>${lines(S.cards.map(k=>[k.n,$$(cAvail(k))]))}</div></div>`}

function dedCard(p,c){const rows=pre=>c.ded.map((d,i)=>!!d.pre!=pre?'':`<div class="row ed">${I(`${p}.ded.${i}.n`)}${I(`${p}.ded.${i}.a`,'number','a')}${X(p+'.ded',i)}</div>`).join('');
 return `<details class="card" ${O[p]?'open':''} data-o="${p}"><summary><h3><span>Payroll deductions</span><span>${$$(dsum(c,true)+dsum(c,false))}</span></h3></summary><div class="mu">Pre-tax · ${$$(dsum(c,true))}</div>${rows(true)}<button class="g" data-a="addDed" data-pre="1">+ Pre-tax</button><div class="mu">Post-tax · ${$$(dsum(c,false))}</div>${rows(false)}<button class="g" data-a="addDed" data-pre="0">+ Post-tax</button><div class="mu">Pre-tax lowers taxable pay. Post-tax comes off at the end.</div></details>`}

 const linked=(a,id,tag,cls,ttl)=>row(`<input type="checkbox" ${x.paid?'checked':''} data-a="${a}" data-id="${id}"${x.pay?` data-pay="${x.pay}"`:''}><span class="ro">${esc(x.n)}</span><span class="ro a">${$$(num(x.a))}</span><span class="tag ${cls}" title="${ttl}">${tag}</span>`);
 if(x.loan)return linked('loanPaid',x.loan,'DEBT','debt','Edit in Debt');

 return row(C(`${p}.items.${i}.paid`)+I(q+'.n')+I(q+(j>=0?'.b':'.a'),'number','a')+(j>=0?'<span class="tag" title="Edit in Categories">CAT</span>':X(p+'.items',i)))}
function vBudget(){

function delCheck(){if(S.checks.length<2){alert('You need at least one paycheck, so this one can\'t be deleted.');return}
 const i=K,c=S.checks[i],e=new Date(chkEnd(i)+'T00:00');e.setDate(e.getDate()-1);const old=c.date<logCut();
 openDlg('Delete Paycheck '+(i+1)+'?',fd(c.date)+' – '+fd(iso(e))+'. '+(old?'It\'s more than six months old, so it can\'t be logged.':'Logging keeps a read-only copy in Settings until '+longDate(stepDate(c.date,'Monthly',LOG_MO))+'.'),
  [...(old?[]:[['Log and delete','',()=>rmCheck(i,1)]]),['Delete without logging','x bd',()=>rmCheck(i,0)],['Cancel','g bd',null]])}

function delLoan(i){const l=S.loans[i];if(!l)return;const n=sum(S.checks,c=>c.items.filter(x=>x.loan==l.id).length);
 let keep=false;if(n)keep=!confirm(`“${l.n}” has ${n} payment${n>1?'s':''} in your budget.\n\nOK: remove ${n>1?'them':'it'} from the budget too.\nCancel: keep ${n>1?'them as regular budget items':'it as a regular budget item'}.`);
 const snap=new Map(S.checks.map(c=>[c,c.items]));
 if(keep)S.checks.forEach(c=>{c.items=c.items.map(x=>x.loan!=l.id?x:{g:x.g,n:x.n,a:x.a,paid:!!x.paid,due:x.due})});
 S.loans.splice(i,1);save();R();
 toast('Deleted “'+l.n+'”'+(n?keep?' (budget items kept)':' and its budget items':''),()=>{S.loans.splice(Math.min(i,S.loans.length),0,l);snap.forEach((it,c)=>c.items=it);save();R()})}

function bkFile(){const n=new Date(),p=x=>String(x).padStart(2,'0'),d=iso(n),t=p(n.getHours())+'-'+p(n.getMinutes());return new File([JSON.stringify({app:LS,exported:n.toISOString(),exportedLocal:d+' '+t.replace('-',':'),data:S},null,1)],'big-minty-finances-backup-'+d+'_'+t+'.json',{type:'application/json'})}
